[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tokio-ai"
version = "0.5.0"
description = "Is your backtest real? Tests a strategy for luck, serial dependence and selection bias, with measured false-positive rates. Works with vectorbt and backtesting.py."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "Jordan Ahern" }]
keywords = ["backtesting", "vectorbt", "backtesting.py", "overfitting", "sharpe-ratio", "algorithmic-trading", "statistics", "hypothesis-testing", "quantitative-finance"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Financial and Insurance Industry",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Office/Business :: Financial :: Investment",
    "Topic :: Scientific/Engineering :: Information Analysis",
    "Programming Language :: Python :: 3.14",
]
dependencies = [
    "numpy>=1.22",
    "openai>=1.50.0",
    "textual>=0.60.0",
]

[project.urls]
Homepage = "https://jordanahern2009-svg.github.io/Tokio-ai/"
Repository = "https://github.com/jordanahern2009-svg/Tokio-ai"
Documentation = "https://github.com/jordanahern2009-svg/Tokio-ai#readme"
Issues = "https://github.com/jordanahern2009-svg/Tokio-ai/issues"

[project.scripts]
tokio-ai = "tokio_ai.tui:main"
tokio-ai-plain = "tokio_ai.cli:main"
tokio-ai-backtest = "tokio_ai.backtest_cli:main"

[project.optional-dependencies]
dev = ["pytest>=8.0"]
# Only for the comparison scripts (calibration_check.py, benchmark.py), which
# run the tests TokIO is measured against.
calibration = ["scipy", "statsmodels", "arch"]

[tool.hatch.build.targets.wheel]
packages = ["src/tokio_ai"]
