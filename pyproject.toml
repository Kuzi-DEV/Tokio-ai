[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tokio-ai"
version = "0.5.1"
description = "Is your backtest real? Deflated Sharpe Ratio, overfitting and lookahead checks with measured false-positive rates. Works with vectorbt, backtesting.py and TradingView."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "Jordan Ahern" }]
keywords = ["backtesting", "deflated-sharpe-ratio", "probabilistic-sharpe-ratio", "backtest-overfitting", "tradingview", "vectorbt", "backtesting.py", "sharpe-ratio", "algorithmic-trading", "statistics", "quantitative-finance"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Financial and Insurance Industry",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Office/Business :: Financial :: Investment",
    "Topic :: Scientific/Engineering :: Information Analysis",
    "Programming Language :: Python :: 3.14",
]
dependencies = [
    "numpy>=1.22",
]

[project.urls]
Homepage = "https://kuzi-dev.github.io/Tokio-ai/"
Repository = "https://github.com/Kuzi-DEV/Tokio-ai"
Documentation = "https://github.com/Kuzi-DEV/Tokio-ai#readme"
Issues = "https://github.com/Kuzi-DEV/Tokio-ai/issues"

[project.scripts]
tokio-ai = "tokio_ai._agent_entry:tui"
tokio-ai-plain = "tokio_ai._agent_entry:plain"
tokio-ai-backtest = "tokio_ai.backtest_cli:main"

[project.optional-dependencies]
# The LLM research agent (tokio-ai / tokio-ai-plain). The statistics need only numpy.
agent = ["openai>=1.50.0", "textual>=0.60.0"]
dev = ["pytest>=8.0", "openai>=1.50.0", "textual>=0.60.0"]
# Only for the comparison scripts (calibration_check.py, benchmark.py), which
# run the tests TokIO is measured against.
calibration = ["scipy", "statsmodels", "arch"]

[tool.hatch.build.targets.wheel]
packages = ["src/tokio_ai"]
